spring.application.name=jobtrackr

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobtrackr_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:jobtrackr}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.jackson.default-property-inclusion=non_null
spring.jackson.mapper.accept-case-insensitive-enums=true

server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.google.client-id=${GOOGLE_CLIENT_ID:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.auth.mail.host=${MAIL_HOST:}
app.auth.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.auth.otp.ttl=${AUTH_OTP_TTL:10m}
app.auth.otp.resend-cooldown=${AUTH_OTP_RESEND_COOLDOWN:1m}
app.auth.otp.max-attempts=${AUTH_OTP_MAX_ATTEMPTS:5}
app.auth.otp.length=6
app.auth.otp.pepper=${AUTH_OTP_PEPPER:${JWT_SECRET}}

app.integrations.gmail.client-id=${GOOGLE_GMAIL_CLIENT_ID:}
app.integrations.gmail.client-secret=${GOOGLE_GMAIL_CLIENT_SECRET:}
app.integrations.gmail.token-encryption-key=${GMAIL_TOKEN_ENCRYPTION_KEY:}
app.integrations.gmail.redirect-uri=${GOOGLE_GMAIL_REDIRECT_URI:http://localhost:8080/api/integrations/gmail/callback}
app.integrations.gmail.frontend-callback-url=${GMAIL_FRONTEND_CALLBACK_URL:http://localhost:4200/settings}
app.integrations.gmail.state-ttl=${GMAIL_OAUTH_STATE_TTL:10m}
app.integrations.gmail.import.lookback-days=${GMAIL_IMPORT_LOOKBACK_DAYS:180}
app.integrations.gmail.import.max-messages=${GMAIL_IMPORT_MAX_MESSAGES:100}
