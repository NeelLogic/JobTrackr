spring.datasource.url=jdbc:h2:mem:jobtrackr;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=jobtrackr-test-secret-key-that-is-at-least-32-bytes-long
