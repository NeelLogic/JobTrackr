<button
  class="theme-toggle"
  type="button"
  [class.theme-toggle--compact]="compact()"
  [attr.data-tone]="tone()"
  [attr.aria-label]="nextThemeLabel()"
  [attr.title]="nextThemeLabel()"
  [attr.aria-pressed]="isDark()"
  (click)="toggle()"
>
  <span class="theme-toggle__icon" aria-hidden="true">
    @if (isDark()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41"></path>
        <path d="M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"></path>
      </svg>
    }
  </span>
  @if (!compact()) {
    <span>{{ visibleLabel() }}</span>
  }
</button>
