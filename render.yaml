services:
  - type: web
    name: jobtrackr-api-neellogic
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Backend/jobtrackr/Dockerfile
    dockerContext: ./Backend/jobtrackr
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://jobtrackr-neellogic.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: jobtrackr-neellogic
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    rootDir: Frontend
    buildCommand: npm ci && npm run config:check && npm run build
    staticPublishPath: ./dist/jobtrackr/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JOBTRACKR_API_URL
        value: https://jobtrackr-api-neellogic.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
